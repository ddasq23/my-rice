# gruvbox palette — the ONLY file you need to edit for this theme.
# Run: scripts/theme-switch.sh gruvbox   (colors for every app are rendered from here)

name = gruvbox
dark = true

# Surfaces and text
bg = #282828
bg_alt = #1d2021
surface = #3c3836
surface_alt = #504945
fg = #ebdbb2
fg_dim = #d5c4a1
overlay = #928374

# Accents and status
accent = #d79921
accent_alt = #fe8019
accent2 = #d3869b
warning = #d79921
critical = #cc241d
ok = #98971a

# Terminal ANSI colors (color0-7 normal, color8-15 bright)
color0 = #3c3836
color1 = #cc241d
color2 = #98971a
color3 = #d79921
color4 = #fe8019
color5 = #d79921
color6 = #fe8019
color7 = #ebdbb2
color8 = #504945
color9 = #cc241d
color10 = #98971a
color11 = #d79921
color12 = #fe8019
color13 = #d79921
color14 = #fe8019
color15 = #d5c4a1

# Cursor theme (installed by install.sh / AUR). Falls back to Adwaita if missing.
cursor_theme = Bibata-Modern-Amber
cursor_size = 24

# Default wallpaper (file in wallpapers/)
wallpaper = gruvbox.png

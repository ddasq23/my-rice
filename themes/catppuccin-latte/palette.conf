# catppuccin-latte palette — the ONLY file you need to edit for this theme.
# Run: scripts/theme-switch.sh catppuccin-latte   (colors for every app are rendered from here)

name = catppuccin-latte
dark = false

# Surfaces and text
bg = #eff1f5
bg_alt = #e6e9ef
surface = #ccd0da
surface_alt = #bcc0cc
fg = #4c4f69
fg_dim = #6c6f85
overlay = #9ca0b0

# Accents and status
accent = #8839ef
accent_alt = #1e66f5
accent2 = #ea76cb
warning = #df8e1d
critical = #d20f39
ok = #40a02b

# Terminal ANSI colors (color0-7 normal, color8-15 bright)
color0 = #ccd0da
color1 = #d20f39
color2 = #40a02b
color3 = #df8e1d
color4 = #1e66f5
color5 = #8839ef
color6 = #1e66f5
color7 = #4c4f69
color8 = #bcc0cc
color9 = #d20f39
color10 = #40a02b
color11 = #df8e1d
color12 = #1e66f5
color13 = #8839ef
color14 = #1e66f5
color15 = #6c6f85

# Cursor theme (installed by install.sh / AUR). Falls back to Adwaita if missing.
cursor_theme = Catppuccin-Latte-Dark-Cursors
cursor_size = 24

# Default wallpaper (file in wallpapers/)
wallpaper = catppuccin-latte.png

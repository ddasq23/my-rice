# nord palette — the ONLY file you need to edit for this theme.
# Run: scripts/theme-switch.sh nord   (colors for every app are rendered from here)

name = nord
dark = true

# Surfaces and text
bg = #2e3440
bg_alt = #242933
surface = #3b4252
surface_alt = #434c5e
fg = #e5e9f0
fg_dim = #d8dee9
overlay = #4c566a

# Accents and status
accent = #88c0d0
accent_alt = #5e81ac
accent2 = #b48ead
warning = #ebcb8b
critical = #bf616a
ok = #a3be8c

# Terminal ANSI colors (color0-7 normal, color8-15 bright)
color0 = #3b4252
color1 = #bf616a
color2 = #a3be8c
color3 = #ebcb8b
color4 = #5e81ac
color5 = #88c0d0
color6 = #5e81ac
color7 = #e5e9f0
color8 = #434c5e
color9 = #bf616a
color10 = #a3be8c
color11 = #ebcb8b
color12 = #5e81ac
color13 = #88c0d0
color14 = #5e81ac
color15 = #d8dee9

# Cursor theme (installed by install.sh / AUR). Falls back to Adwaita if missing.
cursor_theme = Bibata-Modern-Ice
cursor_size = 24

# Default wallpaper (file in wallpapers/)
wallpaper = nord.png

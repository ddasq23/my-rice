# catppuccin-mocha palette — the ONLY file you need to edit for this theme.
# Run: scripts/theme-switch.sh catppuccin-mocha   (colors for every app are rendered from here)

name = catppuccin-mocha
dark = true

# Surfaces and text
bg = #1e1e2e
bg_alt = #181825
surface = #313244
surface_alt = #45475a
fg = #cdd6f4
fg_dim = #a6adc8
overlay = #6c7086

# Accents and status
accent = #cba6f7
accent_alt = #89b4fa
accent2 = #f5c2e7
warning = #f9e2af
critical = #f38ba8
ok = #a6e3a1

# Terminal ANSI colors (color0-7 normal, color8-15 bright)
color0 = #313244
color1 = #f38ba8
color2 = #a6e3a1
color3 = #f9e2af
color4 = #89b4fa
color5 = #cba6f7
color6 = #89b4fa
color7 = #cdd6f4
color8 = #45475a
color9 = #f38ba8
color10 = #a6e3a1
color11 = #f9e2af
color12 = #89b4fa
color13 = #cba6f7
color14 = #89b4fa
color15 = #a6adc8

# Cursor theme (installed by install.sh / AUR). Falls back to Adwaita if missing.
cursor_theme = Catppuccin-Mocha-Dark-Cursors
cursor_size = 24

# Default wallpaper (file in wallpapers/)
wallpaper = catppuccin-mocha.png

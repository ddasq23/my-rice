# dracula palette — the ONLY file you need to edit for this theme.
# Run: scripts/theme-switch.sh dracula   (colors for every app are rendered from here)

name = dracula
dark = true

# Surfaces and text
bg = #282a36
bg_alt = #21222c
surface = #44475a
surface_alt = #565971
fg = #f8f8f2
fg_dim = #bfbfd4
overlay = #6272a4

# Accents and status
accent = #bd93f9
accent_alt = #ff79c6
accent2 = #8be9fd
warning = #f1fa8c
critical = #ff5555
ok = #50fa7b

# Terminal ANSI colors (color0-7 normal, color8-15 bright)
color0 = #44475a
color1 = #ff5555
color2 = #50fa7b
color3 = #f1fa8c
color4 = #ff79c6
color5 = #bd93f9
color6 = #ff79c6
color7 = #f8f8f2
color8 = #565971
color9 = #ff5555
color10 = #50fa7b
color11 = #f1fa8c
color12 = #ff79c6
color13 = #bd93f9
color14 = #ff79c6
color15 = #bfbfd4

# Cursor theme (installed by install.sh / AUR). Falls back to Adwaita if missing.
cursor_theme = Bibata-Modern-Classic
cursor_size = 24

# Default wallpaper (file in wallpapers/)
wallpaper = dracula.png

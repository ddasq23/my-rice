# amoled palette — the ONLY file you need to edit for this theme.
# Run: scripts/theme-switch.sh amoled   (colors for every app are rendered from here)

name = amoled
dark = true

# Surfaces and text
bg = #000000
bg_alt = #000000
surface = #111111
surface_alt = #1f1f1f
fg = #e6e6e6
fg_dim = #9a9a9a
overlay = #555555

# Accents and status
accent = #00d7ff
accent_alt = #5f87ff
accent2 = #ff6ac1
warning = #ffcc66
critical = #ff5f5f
ok = #5fd787

# Terminal ANSI colors (color0-7 normal, color8-15 bright)
color0 = #000000
color1 = #ff5f5f
color2 = #5fd787
color3 = #ffcc66
color4 = #5f87ff
color5 = #ff6ac1
color6 = #00d7ff
color7 = #e6e6e6
color8 = #555555
color9 = #ff8787
color10 = #87ffaf
color11 = #ffe08a
color12 = #8fa8ff
color13 = #ff8ad0
color14 = #66e6ff
color15 = #ffffff

# Cursor theme (installed by install.sh / AUR). Falls back to Adwaita if missing.
cursor_theme = Bibata-Modern-Ice
cursor_size = 24

# Default wallpaper (file in wallpapers/)
wallpaper = amoled.png

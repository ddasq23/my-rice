# tokyo-night palette — the ONLY file you need to edit for this theme.
# Run: scripts/theme-switch.sh tokyo-night   (colors for every app are rendered from here)

name = tokyo-night
dark = true

# Surfaces and text
bg = #1a1b26
bg_alt = #16161e
surface = #24283b
surface_alt = #414868
fg = #c0caf5
fg_dim = #a9b1d6
overlay = #565f89

# Accents and status
accent = #7aa2f7
accent_alt = #bb9af7
accent2 = #7dcfff
warning = #e0af68
critical = #f7768e
ok = #9ece6a

# Terminal ANSI colors (color0-7 normal, color8-15 bright)
color0 = #24283b
color1 = #f7768e
color2 = #9ece6a
color3 = #e0af68
color4 = #bb9af7
color5 = #7aa2f7
color6 = #bb9af7
color7 = #c0caf5
color8 = #414868
color9 = #f7768e
color10 = #9ece6a
color11 = #e0af68
color12 = #bb9af7
color13 = #7aa2f7
color14 = #bb9af7
color15 = #a9b1d6

# Cursor theme (installed by install.sh / AUR). Falls back to Adwaita if missing.
cursor_theme = Bibata-Modern-Ice
cursor_size = 24

# Default wallpaper (file in wallpapers/)
wallpaper = tokyo-night.png

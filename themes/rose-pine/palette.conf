# rose-pine palette — the ONLY file you need to edit for this theme.
# Run: scripts/theme-switch.sh rose-pine   (colors for every app are rendered from here)

name = rose-pine
dark = true

# Surfaces and text
bg = #191724
bg_alt = #1f1d2e
surface = #1f1d2e
surface_alt = #403d52
fg = #e0def4
fg_dim = #908caa
overlay = #6e6a86

# Accents and status
accent = #c4a7e7
accent_alt = #9ccfd8
accent2 = #ebbcba
warning = #f6c177
critical = #eb6f92
ok = #31748f

# Terminal ANSI colors (color0-7 normal, color8-15 bright)
color0 = #26233a
color1 = #eb6f92
color2 = #31748f
color3 = #f6c177
color4 = #9ccfd8
color5 = #c4a7e7
color6 = #ebbcba
color7 = #e0def4
color8 = #6e6a86
color9 = #eb6f92
color10 = #31748f
color11 = #f6c177
color12 = #9ccfd8
color13 = #c4a7e7
color14 = #ebbcba
color15 = #e0def4

# Cursor theme (installed by install.sh / AUR). Falls back to Adwaita if missing.
cursor_theme = Bibata-Modern-Classic
cursor_size = 24

# Default wallpaper (file in wallpapers/)
wallpaper = rose-pine.png
